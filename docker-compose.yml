version: '3.8'

services:
  cybershield:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cybershield-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
    volumes:
      # Persistent volume for SQLite scan history
      - cybershield_db:/app/backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  cybershield_db:
    driver: local
